# Конфиг mjpeg-streamer
device       = /dev/video0
width        = 1920
height       = 1080
fps          = 30
buffer_count = 4

# Адрес MacBook
server_host  = 192.168.2.1
server_port  = 9000

# Пауза между попытками переподключения, мс
reconnect_ms = 1000

# Если кадров нет дольше watchdog_ms — перезапустить камеру
watchdog_ms  = 2000

verbose      = 0